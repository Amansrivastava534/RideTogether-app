<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join ride · RideTogether</title>
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: light dark; --accent: #ff6d00; }
    body { font: 17px/1.5 system-ui, sans-serif; margin: 0; padding: 32px 16px; text-align: center; }
    main { max-width: 420px; margin: auto; }
    .code { font-size: 40px; font-weight: 800; letter-spacing: 6px; margin: 16px 0; }
    a.btn { display: block; background: var(--accent); color: #fff; padding: 16px; border-radius: 14px;
            text-decoration: none; font-weight: 700; margin: 12px 0; }
    small { opacity: .7; }
  </style>
</head>
<body>
<main>
  <h1>🏍️ You're invited to a ride</h1>
  <p>Open RideTogether and enter this code:</p>
  <div class="code" id="code">—</div>
  <a class="btn" id="open" href="#">Open in RideTogether</a>
  <p><small>Don’t have the app yet? Install RideTogether, then tap the invite link again or enter the code under “Join ride”.</small></p>
</main>
<script>
  const code = (location.pathname.split('/j/')[1] || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase().slice(0, 8);
  document.getElementById('code').textContent = code || '—';
  const path = 'ridetogether-4590.web.app/j/' + code;
  document.getElementById('open').href = /Android/i.test(navigator.userAgent)
    ? 'intent://' + path + '#Intent;scheme=ridetogether;package=com.ridetogether.app;end'
    : 'ridetogether://' + path;
</script>
</body>
</html>
